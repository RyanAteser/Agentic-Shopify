name: App checks
# Tests, migrations and Docker smoke never need repository write privileges.
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm run typecheck
      - run: npm test
      - name: Verify offline merchant pilot accounting and frozen-manifest reconciliation
        run: python3 -m unittest discover -s tests -p 'test_merchant*.py' -v
      - name: Verify paired pilot estimator regressions
        run: python3 -m unittest discover -s tests -p 'test_pilot_pair_estimator.py' -v
      - run: npm run build
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: agentic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic -d agentic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agentic:test-only-password@localhost:5432/agentic_test?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx prisma migrate deploy --schema prisma/schema.postgresql.prisma
      - run: npx prisma generate --schema prisma/schema.postgresql.prisma
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --pull --tag agentic-shopify:ci .
      - run: bash scripts/ci-container-smoke.sh agentic-shopify:ci
