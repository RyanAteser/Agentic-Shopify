# Example only. Do not deploy until stable HTTPS app origin and OAuth callbacks exist.
# Link the correct Partner app from a trusted operator environment.
client_id = ""
name = "Agentic Commerce MBB Pilot"
embedded = true
application_url = "https://example.com/app/catalog"

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = ["https://example.com/auth/callback"]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
uri = "/webhooks/app/uninstalled"
topics = ["app/uninstalled"]

[[webhooks.subscriptions]]
uri = "/webhooks/app/scopes_update"
topics = ["app/scopes_update"]

[[webhooks.subscriptions]]
uri = "/webhooks/customers/data_request"
compliance_topics = ["customers/data_request"]

[[webhooks.subscriptions]]
uri = "/webhooks/customers/redact"
compliance_topics = ["customers/redact"]

[[webhooks.subscriptions]]
uri = "/webhooks/shop/redact"
compliance_topics = ["shop/redact"]
